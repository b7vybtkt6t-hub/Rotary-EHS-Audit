<script>(() => {
  'use strict';

  const cfg = window.ROTARY_EHS_CONFIG || {};
  const TEMPLATE = window.ROTARY_AUDIT_TEMPLATE || [];
  const app = document.getElementById('app');
  const toastRoot = document.getElementById('toast');
  const SESSION_KEY = 'rotary_ehs_session_v1';
  const DRAFT_KEY = 'rotary_ehs_new_audit_draft_v1';

  const state = {
    session: loadJson(SESSION_KEY),
    profile: null,
    view: 'dashboard',
    auditId: null,
    audits: [],
    items: [],
    evidence: [],
    expandedSections: new Set(TEMPLATE.map(s => s.key)),
    busy: false,
    storageReady: false
  };

  function loadJson(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; }
  }
  function saveJson(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
  function esc(v='') { return String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c])); }
  function attr(v='') { return esc(v).replace(/`/g,'&#096;'); }
  function fmtDate(v) { if (!v) return '—'; const d = new Date(v.length === 10 ? `${v}T12:00:00` : v); return isNaN(d) ? v : d.toLocaleDateString('en-GB'); }
  function fmtDateTime(v) { if (!v) return '—'; const d = new Date(v); return isNaN(d) ? v : d.toLocaleString('en-GB'); }
  function today() { return new Date().toISOString().slice(0,10); }
  function uid() { return state.session?.user?.id || state.session?.user_id || ''; }
  function toast(msg, type='') {
    const el = document.createElement('div'); el.className = `toast ${type}`; el.textContent = msg; toastRoot.appendChild(el);
    setTimeout(() => el.remove(), 3800);
  }
  function setBusy(v) { state.busy = v; document.querySelectorAll('button').forEach(b => { if (b.dataset.busyLock === '1') b.disabled = v; }); }
  function configReady() { return cfg.supabaseUrl && !String(cfg.supabaseUrl).includes('__SUPABASE') && cfg.supabaseKey && !String(cfg.supabaseKey).includes('__SUPABASE'); }
  function apiHeaders(extra={}) { return { 'apikey': cfg.supabaseKey, ...extra }; }
  function authHeaders(extra={}) { return apiHeaders({ 'Authorization': `Bearer ${state.session?.access_token || ''}`, ...extra }); }
  function encodePath(path) { return path.split('/').map(encodeURIComponent).join('/'); }

  async function fetchJson(url, options={}, allow204=false) {
    const res = await fetch(url, options);
    if (res.status === 204 && allow204) return null;
    const text = await res.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!res.ok) {
      const message = data?.msg || data?.message || data?.error_description || data?.error || `${res.status} ${res.statusText}`;
      const err = new Error(message); err.status = res.status; err.payload = data; throw err;
    }
    return data;
  }

  async function ensureFreshSession() {
    if (!state.session?.refresh_token) return false;
    const expiresAt = Number(state.session.expires_at || 0);
    if (expiresAt && Date.now()/1000 < expiresAt - 90) return true;
    try {
      const data = await fetchJson(`${cfg.supabaseUrl}/auth/v1/token?grant_type=refresh_token`, {
        method:'POST', headers: apiHeaders({'Content-Type':'application/json'}), body: JSON.stringify({refresh_token:state.session.refresh_token})
      });
      setSession(data); return true;
    } catch (e) { clearSession(); return false; }
  }
  function setSession(data) {
    const session = { ...data, expires_at: Math.floor(Date.now()/1000) + Number(data.expires_in || 3600) };
    state.session = session; saveJson(SESSION_KEY, session);
  }
  function clearSession() { state.session = null; state.profile = null; localStorage.removeItem(SESSION_KEY); }

  async function signIn(email,password) {
    const data = await fetchJson(`${cfg.supabaseUrl}/auth/v1/token?grant_type=password`, {
      method:'POST', headers: apiHeaders({'Content-Type':'application/json'}), body: JSON.stringify({email,password})
    }); setSession(data); return data;
  }
  async function signUp(email,password,fullName) {
    return fetchJson(`${cfg.supabaseUrl}/auth/v1/signup`, {
      method:'POST', headers: apiHeaders({'Content-Type':'application/json'}), body: JSON.stringify({email,password,data:{full_name:fullName}})
    });
  }
  async function signOut() {
    try { await fetch(`${cfg.supabaseUrl}/auth/v1/logout`, {method:'POST', headers:authHeaders()}); } catch {}
    clearSession(); renderAuth();
  }

  async function rest(table, {method='GET', query='', body=null, prefer='return=representation'}={}) {
    await ensureFreshSession();
    const headers = authHeaders({'Content-Type':'application/json'}); if (prefer) headers['Prefer'] = prefer;
    const url = `${cfg.supabaseUrl}/rest/v1/${table}${query ? `?${query}` : ''}`;
    return fetchJson(url, {method, headers, body: body == null ? undefined : JSON.stringify(body)}, method==='DELETE');
  }

  async function loadProfile() {
    if (!uid()) return null;
    const rows = await rest('profiles',{query:`user_id=eq.${encodeURIComponent(uid())}&select=*`});
    state.profile = rows?.[0] || null; return state.profile;
  }

  async function boot() {
    // single-file deployment: service worker disabled
    window.addEventListener('online', () => toast('Connection restored','success'));
    window.addEventListener('offline', () => toast('Offline mode — unsent changes remain on this device','error'));
    if (!configReady()) { renderSetupPlaceholder(); return; }
    if (!state.session) { renderAuth(); return; }
    const ok = await ensureFreshSession(); if (!ok) { renderAuth(); return; }
    try { await loadProfile(); renderShell(); route('dashboard'); }
    catch (e) { console.error(e); clearSession(); renderAuth(`Session could not be verified: ${e.message}`); }
  }

  function renderSetupPlaceholder() {
    app.innerHTML = `<div class="auth-shell"><section class="auth-brand"><div><img src="${LOGO_URL}" alt="Rotary EHS Audit"><h1>Rotary EHS Audit</h1><p>Standalone EHS audit system for wind-turbine field audits.</p></div><small>Rotary Sp. z o.o.</small></section><section class="auth-panel"><div class="auth-card"><div class="setup-warning"><b>Backend connection is not configured yet.</b><br>The application files are ready. A separate Supabase project URL and publishable key must be inserted into <code>config.js</code>.</div><h2>Application prepared</h2><p class="sub">After the independent database is created, this screen becomes the normal login page.</p></div></section></div>`;
  }

  function renderAuth(error='') {
    app.innerHTML = `<div class="auth-shell">
      <section class="auth-brand"><div><img src="${LOGO_URL}" alt="Rotary EHS Audit"><h1>Field-ready EHS audits.</h1><p>Photos, findings, corrective actions, historic audit dates and a branded PDF report — in one independent application.</p></div><small>Internal audit tool • Rotary Sp. z o.o.</small></section>
      <section class="auth-panel"><div class="auth-card"><h2>Sign in</h2><p class="sub">Rotary EHS Audit</p>${error?`<div class="setup-warning">${esc(error)}</div>`:''}

  function renderNewAudit(){const c=document.getElementById('content');const d=loadJson(DRAFT_KEY)||{};c.innerHTML=`<div class="page-head"><div><h2>New EHS Audit</h2><p>The audit date can be entered retrospectively. Creation time is stored separately.</p></div></div><form class="card" id="newAuditForm"><div class="form-grid">

    const form=document.getElementById('newAuditForm');form.oninput=()=>{const obj=Object.fromEntries(new FormData(form));saveJson(DRAFT_KEY,obj);};document.getElementById('clearDraft').onclick=()=>{localStorage.removeItem(DRAFT_KEY);renderNewAudit();};form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));try{setBusy(true);const rows=await rest('audits',{method:'POST',body:{...data,created_by:uid()},prefer:'return=representation'});localStorage.removeItem(DRAFT_KEY);toast('Audit created','success');route('audit',{auditId:rows[0].id});}catch(err){toast(err.message,'error')}finally{setBusy(false)}};

  function field(name,label,type='text',value='',required=false){return `<div class="field"><label>${esc(label)}</label><input name="${attr(name)}" type="${type}" value="${attr(value)}" ${required?'required':''}></div>`;}

  function flattenTemplate(){return TEMPLATE.flatMap(sec=>sec.items.map(([key,title])=>({key,title,section:sec.key,sectionTitle:sec.title,maxPoints:sec.maxPoints})));}
  function itemMap(){return new Map(state.items.map(i=>[i.item_key,i]));}
  function scoreAudit(){const map=itemMap();let earned=0,possible=0,answered=0,total=0,nok=0,critical=0;const sections=TEMPLATE.map(sec=>{const vals=sec.items.map(([key])=>map.get(key)).filter(Boolean);let ok=0,applicable=0,answeredSec=0;sec.items.forEach(([key])=>{total++;const it=map.get(key);if(it?.status){answered++;answeredSec++;if(it.status!=='NA'){applicable++;if(it.status==='OK')ok++;}if(it.status==='NOK'){nok++;if(it.severity==='critical')critical++;}}});let sectionEarned=0,sectionPossible=0;if(applicable>0){sectionPossible=sec.maxPoints;sectionEarned=sec.maxPoints*(ok/applicable);earned+=sectionEarned;possible+=sectionPossible;}return {...sec,earned:sectionEarned,possible:sectionPossible,answered:answeredSec,total:sec.items.length};});return {score:possible?Math.round(earned/possible*100):0,earned,possible,answered,total,nok,critical,sections};}

  async function renderAuditDetail(id,opts={}){const c=document.getElementById('content');const preserveKey=opts.preserveKey||null;const preserveSection=opts.preserveSection||null;const preserveScroll=opts.preserveScroll===true||!!preserveKey||!!preserveSection;const oldScrollY=window.scrollY;let oldAnchorTop=null;let anchorSelector=null;if(preserveKey){anchorSelector=`[data-item="${preserveKey}"]`;}else if(preserveSection){anchorSelector=`[data-section-toggle="${preserveSection}"]`;}if(anchorSelector){const oldAnchor=document.querySelector(anchorSelector);if(oldAnchor)oldAnchorTop=oldAnchor.getBoundingClientRect().top;}if(!preserveScroll)c.innerHTML='<div class="card">Loading audit…</div>';const [audits,items,evidence,history]=await Promise.all([rest('audits',{query:`id=eq.${encodeURIComponent(id)}&select=*`}),rest('audit_items',{query:`audit_id=eq.${encodeURIComponent(id)}&select=*`}),rest('audit_evidence',{query:`audit_id=eq.${encodeURIComponent(id)}&select=*&order=created_at.asc`}),rest('audit_change_log',{query:`audit_id=eq.${encodeURIComponent(id)}&select=*&order=changed_at.desc&limit=20`})]);const audit=audits[0];if(!audit)throw new Error('Audit not found');state.items=items;state.evidence=evidence;const s=scoreAudit();const critical=s.critical>0;c.innerHTML=`<div class="page-head"><div><h2>${esc(audit.audit_number)}</h2><p>${fmtDate(audit.audit_date)} • ${esc(audit.customer||'')} • ${esc(audit.site||'')} ${audit.wtg_number?`/ ${esc(audit.wtg_number)}`:''}</p></div><div class="btn-row"><button class="btn ghost" id="editAudit">Edit header</button><button class="btn primary" id="pdfAudit">Generate PDF</button><button class="btn ${audit.status==='complete'?'ghost':'green'}" id="finalizeAudit">${audit.status==='complete'?'Reopen':'Complete audit'}</button></div></div>
    <div id="criticalBanner" class="critical-banner" style="margin-bottom:14px;${critical?'':'display:none'}">🔴 ${s.critical} CRITICAL finding${s.critical>1?'s':''}. Overall audit remains flagged until corrective actions are closed.</div>
    <div class="audit-summary"><div class="card"><div class="score-hero"><div class="score-circle" id="auditScoreCircle" style="--pct:${s.score}%"><strong id="auditScoreValue">${s.score}%</strong></div><div><h3 style="margin:0 0 5px">Audit score</h3><p class="muted" id="auditScoreMeta" style="margin:0">${s.answered}/${s.total} checks answered • ${s.nok} NOK • ${s.critical} critical</p><div class="progressbar" style="margin-top:12px;width:min(430px,100%)"><span id="auditProgress" style="width:${Math.round(s.answered/s.total*100)}%"></span></div></div></div></div><div class="card"><b>Audit date</b><div style="font-size:22px;font-weight:900;margin:6px 0">${fmtDate(audit.audit_date)}</div><div class="tiny muted">Record created: ${fmtDateTime(audit.created_at)}</div><div class="tiny muted">Status: ${audit.status==='complete'?'Completed':'Draft'}</div></div></div>
    ${history?.length?`<div class="card"><div class="card-title"><h3>Audit change history</h3><span class="tiny muted">Last ${history.length} changes</span></div><div class="table-wrap"><table class="table"><thead><tr><th>When</th><th>Field</th><th>Previous</th><th>New</th></tr></thead><tbody>${history.map(h=>`<tr><td>${fmtDateTime(h.changed_at)}</td><td><b>${esc(h.field_name)}</b></td><td>${esc(h.old_value||'—')}</td><td>${esc(h.new_value||'—')}</td></tr>`).join('')}</tbody></table></div></div>`:''}<div class="section-grid">${TEMPLATE.map(sec=>sectionHtml(sec,itemMap(),s.sections.find(x=>x.key===sec.key))).join('')}</div>`;
    bindAuditInteractions(audit); hydrateEvidence();if(preserveScroll){requestAnimationFrame(()=>{if(anchorSelector&&oldAnchorTop!==null){const newAnchor=document.querySelector(anchorSelector);if(newAnchor){window.scrollBy(0,newAnchor.getBoundingClientRect().top-oldAnchorTop);return;}}window.scrollTo(0,oldScrollY);});}
  }

  function sectionHtml(sec,map,score){const open=state.expandedSections.has(sec.key);return `<section class="audit-section"><div class="section-head" data-section-toggle="${sec.key}"><div><h3>${esc(sec.title)}</h3><div class="tiny muted" data-section-meta="${sec.key}">${score.answered}/${score.total} answered • weight ${sec.maxPoints} pts</div></div><div class="section-score" data-section-score="${sec.key}">${score.possible?`${score.earned.toFixed(1)} / ${score.possible}`:'N/A'} ${open?'▴':'▾'}</div></div><div class="section-body" style="display:${open?'block':'none'}">${sec.items.map(([key,title])=>itemHtml(key,title,map.get(key))).join('')}</div></section>`;}
  function itemHtml(key,title,it={}){const status=it.status||'';const showFinding=status==='NOK';const ev=state.evidence.filter(e=>e.item_key===key);return `<div class="audit-item" data-item="${key}"><div class="item-top"><div><div class="item-title">${esc(title)}</div><div class="tiny muted">Evidence-based field verification</div></div><div class="status-buttons">${['OK','NOK','NA'].map(x=>`<button type="button" class="status-btn ${status===x?'active':''}" data-status="${x}" data-key="${key}">${x==='NA'?'N/A':x}</button>`).join('')}</div></div><div class="item-extra"><textarea data-field="comment" data-key="${key}" placeholder="Comment / evidence note">${esc(it.comment||'')}</textarea><select data-field="severity" data-key="${key}"><option value="">Severity</option>${['observation','minor','major','critical'].map(x=>`<option value="${x}" ${it.severity===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select><input data-field="responsible_person" data-key="${key}" placeholder="Responsible person" value="${attr(it.responsible_person||'')}"><input data-field="due_date" data-key="${key}" type="date" value="${attr(it.due_date||'')}"></div><div class="finding-box ${showFinding?'':'hidden'}" data-finding="${key}"><div class="wide"><textarea data-field="corrective_action" data-key="${key}" placeholder="Corrective action">${esc(it.corrective_action||'')}</textarea></div><div><select data-field="action_status" data-key="${key}"><option value="open" ${(!it.action_status||it.action_status==='open')?'selected':''}>Open</option><option value="in_progress" ${it.action_status==='in_progress'?'selected':''}>In progress</option><option value="closed" ${it.action_status==='closed'?'selected':''}>Closed</option></select></div><div><input data-field="action_close_note" data-key="${key}" placeholder="Closure note" value="${attr(it.action_close_note||'')}"></div><div><span class="tiny muted">If critical: consider Stop Work until controls are adequate.</span></div></div><div class="evidence-strip"><label class="btn small ghost camera-label">📷 Add photo<input type="file" accept="image/*" capture="environment" multiple data-upload="${key}"></label><span class="tiny muted" data-evidence-count="${key}">${ev.length} photo${ev.length===1?'':'s'}</span><div id="ev-${key}" style="display:flex;gap:7px;flex-wrap:wrap"></div></div></div>`;}

  function currentItem(key){return state.items.find(i=>i.item_key===key)||null;}
  async function saveItem(key,patch){const existing=currentItem(key)||{};const flat=flattenTemplate().find(x=>x.key===key);const row={audit_id:state.auditId,item_key:key,section_key:flat.section,item_label:flat.title,status:existing.status||null,comment:existing.comment||null,severity:existing.severity||null,corrective_action:existing.corrective_action||null,responsible_person:existing.responsible_person||null,due_date:existing.due_date||null,action_status:existing.action_status||'open',action_close_note:existing.action_close_note||null,updated_by:uid(),...patch};if(row.action_status==='closed'&&!existing.action_closed_at)row.action_closed_at=new Date().toISOString();if(row.action_status!=='closed')row.action_closed_at=null;const rows=await rest('audit_items',{method:'POST',query:'on_conflict=audit_id,item_key',body:row,prefer:'resolution=merge-duplicates,return=representation'});const idx=state.items.findIndex(i=>i.item_key===key);if(idx>=0)state.items[idx]=rows[0];else state.items.push(rows[0]);return rows[0];}
  function refreshAuditMetrics(){const s=scoreAudit();const circle=document.getElementById('auditScoreCircle');const val=document.getElementById('auditScoreValue');const meta=document.getElementById('auditScoreMeta');const progress=document.getElementById('auditProgress');const banner=document.getElementById('criticalBanner');if(circle)circle.style.setProperty('--pct',`${s.score}%`);if(val)val.textContent=`${s.score}%`;if(meta)meta.textContent=`${s.answered}/${s.total} checks answered • ${s.nok} NOK • ${s.critical} critical`;if(progress)progress.style.width=`${Math.round(s.answered/s.total*100)}%`;if(banner){banner.style.display=s.critical?'block':'none';banner.textContent=`🔴 ${s.critical} CRITICAL finding${s.critical>1?'s':''}. Overall audit remains flagged until corrective actions are closed.`;}s.sections.forEach(sec=>{const m=document.querySelector(`[data-section-meta="${sec.key}"]`);const sc=document.querySelector(`[data-section-score="${sec.key}"]`);if(m)m.textContent=`${sec.answered}/${sec.total} answered • weight ${sec.maxPoints} pts`;if(sc){const open=state.expandedSections.has(sec.key);sc.textContent=`${sec.possible?`${sec.earned.toFixed(1)} / ${sec.possible}`:'N/A'} ${open?'▴':'▾'}`;}});}
  function patchItemStatusUI(key,status){const item=document.querySelector(`[data-item="${key}"]`);if(!item)return;item.querySelectorAll('.status-btn').forEach(btn=>{btn.classList.toggle('active',btn.dataset.status===status);btn.disabled=false;});const finding=item.querySelector('.finding-box');if(finding)finding.classList.toggle('hidden',status!=='NOK');const severity=item.querySelector('[data-field="severity"]');if(status==='NOK'&&severity&&!severity.value)severity.value='observation';}
  function bindAuditInteractions(audit){document.querySelectorAll('[data-section-toggle]').forEach(h=>h.onclick=()=>{const k=h.dataset.sectionToggle;const sec=h.closest('.audit-section');const body=sec?.querySelector('.section-body');const score=sec?.querySelector('.section-score');const willOpen=!state.expandedSections.has(k);if(willOpen)state.expandedSections.add(k);else state.expandedSections.delete(k);if(body)body.style.display=willOpen?'block':'none';if(score)score.textContent=score.textContent.replace(/[▴▾]\s*$/,'')+' '+(willOpen?'▴':'▾');});document.querySelectorAll('.status-btn').forEach(b=>b.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const key=b.dataset.key;const status=b.dataset.status;const anchor=document.querySelector(`[data-item="${key}"]`);const anchorTop=anchor?anchor.getBoundingClientRect().top:null;const y=window.scrollY;const prev=currentItem(key)?{...currentItem(key)}:null;const flat=flattenTemplate().find(x=>x.key===key);let local=currentItem(key);if(local){local.status=status;if(status==='NOK'&&!local.severity)local.severity='observation';}else{local={audit_id:state.auditId,item_key:key,section_key:flat.section,item_label:flat.title,status,severity:status==='NOK'?'observation':null,action_status:'open',updated_by:uid()};state.items.push(local);}patchItemStatusUI(key,status);refreshAuditMetrics();try{const patch={status};if(status==='NOK'&&!prev?.severity)patch.severity='observation';await saveItem(key,patch);patchItemStatusUI(key,status);refreshAuditMetrics();requestAnimationFrame(()=>{if(anchor&&anchorTop!==null){const now=anchor.getBoundingClientRect().top;window.scrollBy(0,now-anchorTop);}else window.scrollTo(0,y);});}catch(err){if(prev){const i=state.items.findIndex(x=>x.item_key===key);if(i>=0)state.items[i]=prev;}else state.items=state.items.filter(x=>x.item_key!==key);patchItemStatusUI(key,prev?.status||'');refreshAuditMetrics();window.scrollTo(0,y);toast(err.message,'error');}}));document.querySelectorAll('[data-field]').forEach(el=>{el.onchange=async()=>{const scrollTop=(document.scrollingElement||document.documentElement).scrollTop;try{await saveItem(el.dataset.key,{[el.dataset.field]:el.value||null});refreshAuditMetrics();requestAnimationFrame(()=>{(document.scrollingElement||document.documentElement).scrollTop=scrollTop;});toast('Saved','success');}catch(e){toast(e.message,'error')}};});document.querySelectorAll('[data-upload]').forEach(inp=>inp.onchange=async()=>{if(!inp.files?.length)return;const key=inp.dataset.upload;const scrollTop=(document.scrollingElement||document.documentElement).scrollTop;for(const file of inp.files)await uploadEvidence(key,file);await hydrateEvidenceItem(key);requestAnimationFrame(()=>{(document.scrollingElement||document.documentElement).scrollTop=scrollTop;});});document.getElementById('editAudit').onclick=()=>showEditAuditModal(audit);document.getElementById('pdfAudit').onclick=()=>generatePdf(audit);document.getElementById('finalizeAudit').onclick=async()=>{try{const s=scoreAudit();if(audit.status!=='complete'&&s.answered<s.total){toast(`Complete all checks first (${s.answered}/${s.total})`,'error');return;}const next=audit.status==='complete'?'draft':'complete';await rest('audits',{method:'PATCH',query:`id=eq.${audit.id}`,body:{status:next,completed_at:next==='complete'?new Date().toISOString():null},prefer:'return=representation'});toast(next==='complete'?'Audit completed':'Audit reopened','success');renderAuditDetail(audit.id);}catch(e){toast(e.message,'error')}};}

  async function uploadEvidence(itemKey,file){if(file.size>15*1024*1024){toast(`${file.name}: max 15 MB`,'error');return;}const safe=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');const path=`${state.auditId}/${itemKey}/${Date.now()}-${safe}`;try{await ensureFreshSession();const res=await fetch(`${cfg.supabaseUrl}/storage/v1/object/${encodeURIComponent(cfg.storageBucket)}/${encodePath(path)}`,{method:'POST',headers:authHeaders({'Content-Type':file.type||'application/octet-stream','x-upsert':'false'}),body:file});if(!res.ok){let t=await res.text();throw new Error(t||`Upload failed ${res.status}`);}const rows=await rest('audit_evidence',{method:'POST',body:{audit_id:state.auditId,item_key:itemKey,storage_path:path,file_name:file.name,mime_type:file.type,uploaded_by:uid()},prefer:'return=representation'});state.evidence.push(rows[0]);toast('Photo uploaded','success');}catch(e){if(String(e.message).includes('Bucket not found'))toast('Storage bucket is not ready. Administrator: Settings → Initialize evidence storage.','error');else toast(e.message,'error');}}
  async function signedUrl(path,expires=3600){const data=await fetchJson(`${cfg.supabaseUrl}/storage/v1/object/sign/${encodeURIComponent(cfg.storageBucket)}/${encodePath(path)}`,{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({expiresIn:expires})});const u=data.signedURL||data.signedUrl||data.url;return u?.startsWith('http')?u:`${cfg.supabaseUrl}${u}`;}
  async function hydrateEvidenceItem(itemKey){const host=document.getElementById(`ev-${itemKey}`);if(!host)return;host.innerHTML='';const list=state.evidence.filter(ev=>ev.item_key===itemKey);const count=document.querySelector(`[data-evidence-count="${itemKey}"]`);if(count)count.textContent=`${list.length} photo${list.length===1?'':'s'}`;for(const ev of list){const wrap=document.createElement('span');wrap.style.position='relative';wrap.innerHTML=`<div class="thumb" style="display:grid;place-items:center;font-size:10px;color:#748491">photo</div><button class="btn danger small" style="position:absolute;right:-5px;top:-5px;padding:3px 6px;min-height:auto" title="Delete">×</button>`;host.appendChild(wrap);try{const url=await signedUrl(ev.storage_path,1800);const img=document.createElement('img');img.className='thumb';img.src=url;img.alt=ev.file_name||'Evidence';wrap.querySelector('.thumb').replaceWith(img);img.onclick=()=>window.open(url,'_blank');wrap.querySelector('button').onclick=async()=>{if(!confirm('Delete this evidence photo?'))return;const scrollTop=(document.scrollingElement||document.documentElement).scrollTop;try{await deleteEvidence(ev);state.evidence=state.evidence.filter(x=>x.id!==ev.id);await hydrateEvidenceItem(itemKey);requestAnimationFrame(()=>{(document.scrollingElement||document.documentElement).scrollTop=scrollTop;});toast('Photo deleted','success');}catch(e){toast(e.message,'error')}};}catch{}}}
  async function hydrateEvidence(){for(const key of [...new Set(state.evidence.map(ev=>ev.item_key))])await hydrateEvidenceItem(key);}
  async function deleteEvidence(ev){await fetchJson(`${cfg.supabaseUrl}/storage/v1/object/${encodeURIComponent(cfg.storageBucket)}`,{method:'DELETE',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({prefixes:[ev.storage_path]})},true).catch(async()=>{const r=await fetch(`${cfg.supabaseUrl}/storage/v1/object/${encodeURIComponent(cfg.storageBucket)}/${encodePath(ev.storage_path)}`,{method:'DELETE',headers:authHeaders()});if(!r.ok)throw new Error(await r.text());});await rest('audit_evidence',{method:'DELETE',query:`id=eq.${ev.id}`,prefer:''});}

  function showEditAuditModal(audit){const back=document.createElement('div');back.className='modal-backdrop';back.innerHTML=`<div class="modal"><h3>Edit audit header</h3><form id="editHeaderForm"><div class="form-grid">${field('audit_date','Audit date','date',audit.audit_date,true)}${field('customer','Customer','text',audit.customer||'',true)}${field('site','Site','text',audit.site||'',true)}${field('country','Country','text',audit.country||'')}${field('wtg_number','WTG number','text',audit.wtg_number||'')}${field('turbine_type','Turbine type','text',audit.turbine_type||'')}${field('project_po','Project / PO','text',audit.project_po||'')}${field('company_audited','Company audited','text',audit.company_audited||'')}${field('auditor_name','Auditor','text',audit.auditor_name||'',true)}${field('site_supervisor','Site supervisor','text',audit.site_supervisor||'')}${field('start_time','Start time','time',audit.start_time||'')}${field('finish_time','Finish time','time',audit.finish_time||'')}<div class="field full"><label>Technicians present</label><textarea name="technicians_present">${esc(audit.technicians_present||'')}</textarea></div><div class="field full"><label>Scope of work</label><textarea name="scope_of_work">${esc(audit.scope_of_work||'')}</textarea></div><div class="field full"><label>Weather / site conditions</label><textarea name="weather">${esc(audit.weather||'')}</textarea></div></div><div class="hr"></div><div class="btn-row"><button class="btn green" type="submit">Save</button><button class="btn ghost" type="button" id="modalCancel">Cancel</button></div></form></div>`;document.body.appendChild(back);document.getElementById('modalCancel').onclick=()=>back.remove();document.getElementById('editHeaderForm').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));await rest('audits',{method:'PATCH',query:`id=eq.${audit.id}`,body:data,prefer:'return=representation'});back.remove();toast('Audit header updated','success');renderAuditDetail(audit.id);}catch(err){toast(err.message,'error')}};}

  async function renderActions(){const c=document.getElementById('content');c.innerHTML='<div class="card">Loading corrective actions…</div>';const [items,audits]=await Promise.all([rest('audit_items',{query:'status=eq.NOK&select=*&order=updated_at.desc'}),getAudits()]);const amap=new Map(audits.map(a=>[a.id,a]));c.innerHTML=`<div class="page-head"><div><h2>Corrective Actions</h2><p>All NOK findings across audits.</p></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Severity</th><th>Finding</th><th>Audit / Site</th><th>Action</th><th>Responsible</th><th>Due</th><th>Status</th></tr></thead><tbody>${items.length?items.map(i=>{const a=amap.get(i.audit_id)||{};return `<tr class="clickable" data-action-audit="${i.audit_id}"><td><span class="pill ${i.severity||'observation'}">${esc(i.severity||'observation')}</span></td><td><b>${esc(i.item_label)}</b><div class="tiny muted">${esc(i.comment||'')}</div></td><td>${esc(a.audit_number||'')}<div class="tiny muted">${esc(a.site||'')} ${a.wtg_number?'/ '+esc(a.wtg_number):''}</div></td><td>${esc(i.corrective_action||'—')}</td><td>${esc(i.responsible_person||'—')}</td><td>${fmtDate(i.due_date)}</td><td><span class="pill ${i.action_status==='closed'?'closed':i.action_status==='in_progress'?'progress':'open'}">${esc((i.action_status||'open').replace('_',' '))}</span></td></tr>`}).join(''):`<tr><td colspan="7" class="empty">No NOK findings.</td></tr>`}</tbody></table></div></div>`;document.querySelectorAll('[data-action-audit]').forEach(r=>r.onclick=()=>route('audit',{auditId:r.dataset.actionAudit}));}

  async function renderUsers(){if(state.profile?.role!=='admin'){document.getElementById('content').innerHTML='<div class="card">Administrator access required.</div>';return;}const c=document.getElementById('content');c.innerHTML='<div class="card">Loading users…</div>';const users=await rest('profiles',{query:'select=*&order=created_at.asc'});c.innerHTML=`<div class="page-head"><div><h2>Users</h2><p>Approve accounts and assign roles.</p></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Created</th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.full_name||'—')}</b></td><td>${esc(u.email||'—')}</td><td><select data-user-role="${u.user_id}"><option value="auditor" ${u.role==='auditor'?'selected':''}>Auditor</option><option value="manager" ${u.role==='manager'?'selected':''}>Manager</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></td><td><select data-user-active="${u.user_id}"><option value="true" ${u.active?'selected':''}>Active</option><option value="false" ${!u.active?'selected':''}>Inactive</option></select></td><td>${fmtDateTime(u.created_at)}</td></tr>`).join('')}</tbody></table></div></div>`;document.querySelectorAll('[data-user-role]').forEach(el=>el.onchange=()=>updateUser(el.dataset.userRole,{role:el.value}));document.querySelectorAll('[data-user-active]').forEach(el=>el.onchange=()=>updateUser(el.dataset.userActive,{active:el.value==='true'}));}
  async function updateUser(id,patch){try{await rest('profiles',{method:'PATCH',query:`user_id=eq.${id}`,body:patch,prefer:'return=representation'});toast('User updated','success')}catch(e){toast(e.message,'error')}}

  function renderSettings(){const c=document.getElementById('content');c.innerHTML=`<div class="page-head"><div><h2>Settings</h2><p>Application and evidence storage.</p></div></div><div class="card"><div class="logo-preview"><img src="${LOGO_URL}"><div><h3 style="margin:0 0 5px">Rotary EHS Audit</h3><div class="muted">Standalone system • Rotary Sp. z o.o.</div><div class="tiny muted" style="margin-top:4px">Build 2026.09.22.3 · HARD NO-JUMP</div></div></div><div class="hr"></div><div class="form-grid"><div class="field"><label>Backend</label><input value="${attr(cfg.supabaseUrl||'')}" readonly></div><div class="field"><label>Evidence bucket</label><input value="${attr(cfg.storageBucket||'audit-evidence')}" readonly></div></div><div class="hr"></div><p class="muted">Evidence is stored in a private bucket and served through time-limited signed links. Audit date and record creation time are stored separately.</p>${state.profile?.role==='admin'?`<button class="btn primary" id="initStorage">Initialize / verify evidence storage</button>`:''}</div><div class="card"><h3>About reporting</h3><p class="muted">PDFs include a notice that this is an internal Rotary Sp. z o.o. audit tool and not an official GE Vernova system.</p></div>`;const b=document.getElementById('initStorage');if(b)b.onclick=ensureStorage;}
  async function ensureStorage(){try{await ensureFreshSession();const data=await fetchJson(`${cfg.supabaseUrl}/functions/v1/ensure-audit-storage`,{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({bucket:cfg.storageBucket})});toast(data?.message||'Evidence storage ready','success');state.storageReady=true;}catch(e){toast(e.message,'error')}}

  async function generatePdf(audit){try{toast('Preparing PDF…');const s=scoreAudit();if(!window.jspdf?.jsPDF){fallbackPrintableReport(audit);return;}const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});let y=18;const margin=16;const width=178;const logo=await imageData(LOGO_URL);doc.addImage(logo,'PNG',margin,y,38,38);doc.setTextColor(11,49,83);doc.setFontSize(19);doc.setFont(undefined,'bold');doc.text('ROTARY EHS AUDIT',60,25);doc.setFontSize(11);doc.setTextColor(47,143,78);doc.text('Contractor EHS Audit – Wind Turbine',60,32);doc.setFontSize(8.5);doc.setTextColor(95,111,124);doc.text('Internal Rotary Sp. z o.o. audit tool – not an official GE Vernova system.',60,38);y=61;doc.setTextColor(20,30,38);doc.setFontSize(11);const meta=[['Audit No.',audit.audit_number],['Audit date',fmtDate(audit.audit_date)],['Customer',audit.customer||'—'],['Site / WTG',`${audit.site||'—'}${audit.wtg_number?' / '+audit.wtg_number:''}`],['Company audited',audit.company_audited||'—'],['Auditor',audit.auditor_name||'—'],['Scope',audit.scope_of_work||'—'],['Record created',fmtDateTime(audit.created_at)]];meta.forEach(([k,v])=>{doc.setFont(undefined,'bold');doc.text(`${k}:`,margin,y);doc.setFont(undefined,'normal');const lines=doc.splitTextToSize(String(v),128);doc.text(lines,49,y);y+=Math.max(6,lines.length*4.5);});y+=4;doc.setDrawColor(218,228,234);doc.line(margin,y,194,y);y+=8;doc.setFontSize(15);doc.setTextColor(11,49,83);doc.setFont(undefined,'bold');doc.text(`Overall score: ${s.score}%`,margin,y);y+=7;doc.setFontSize(10);doc.setTextColor(s.critical?180:34,s.critical?35:110,s.critical?25:58);doc.text(s.critical?`CRITICAL FINDINGS: ${s.critical}`:`NOK findings: ${s.nok}`,margin,y);y+=9;doc.setTextColor(20,30,38);doc.setFontSize(10);s.sections.forEach(sec=>{doc.setFont(undefined,'bold');doc.text(sec.title,margin,y);doc.setFont(undefined,'normal');doc.text(sec.possible?`${sec.earned.toFixed(1)} / ${sec.possible} pts`:'N/A',194,y,{align:'right'});y+=5;if(y>275){doc.addPage();y=18;}});doc.addPage();y=18;doc.setFontSize(16);doc.setTextColor(11,49,83);doc.setFont(undefined,'bold');doc.text('Detailed checklist',margin,y);y+=9;const map=itemMap();for(const sec of TEMPLATE){if(y>260){doc.addPage();y=18;}doc.setFontSize(12);doc.setFont(undefined,'bold');doc.setTextColor(11,49,83);doc.text(sec.title,margin,y);y+=6;for(const [key,title] of sec.items){const it=map.get(key)||{};const lines=doc.splitTextToSize(`${it.status||'—'}  ${title}`,160);doc.setFontSize(9);doc.setFont(undefined,it.status==='NOK'?'bold':'normal');doc.setTextColor(it.status==='NOK'?160:30,it.status==='NOK'?35:40,it.status==='NOK'?30:48);doc.text(lines,margin,y);y+=lines.length*4.2;if(it.comment){doc.setFont(undefined,'normal');doc.setTextColor(90,103,113);const cl=doc.splitTextToSize(`Comment: ${it.comment}`,160);doc.text(cl,22,y);y+=cl.length*4;}if(it.status==='NOK'){const fl=doc.splitTextToSize(`Severity: ${it.severity||'—'} | Action: ${it.corrective_action||'—'} | Responsible: ${it.responsible_person||'—'} | Due: ${fmtDate(it.due_date)} | Status: ${it.action_status||'open'}`,160);doc.setTextColor(130,75,25);doc.text(fl,22,y);y+=fl.length*4;}y+=3;if(y>278){doc.addPage();y=18;}}}
      const findings=state.items.filter(i=>i.status==='NOK');if(findings.length){doc.addPage();y=18;doc.setFontSize(16);doc.setTextColor(11,49,83);doc.setFont(undefined,'bold');doc.text('Findings & Corrective Actions',margin,y);y+=10;for(const f of findings){if(y>245){doc.addPage();y=18;}doc.setFontSize(10);doc.setTextColor(f.severity==='critical'?165:30,f.severity==='critical'?30:45,f.severity==='critical'?25:55);doc.setFont(undefined,'bold');doc.text(`${String(f.severity||'observation').toUpperCase()} — ${f.item_label}`,margin,y);y+=5;doc.setFont(undefined,'normal');doc.setTextColor(50,60,68);for(const line of [`Finding: ${f.comment||'—'}`,`Corrective action: ${f.corrective_action||'—'}`,`Responsible: ${f.responsible_person||'—'}   Due: ${fmtDate(f.due_date)}   Status: ${f.action_status||'open'}`,f.action_close_note?`Closure note: ${f.action_close_note}`:'']){if(!line)continue;const ls=doc.splitTextToSize(line,165);doc.text(ls,margin+3,y);y+=ls.length*4.2;}y+=5;}}
      if(state.evidence.length){doc.addPage();y=18;doc.setFontSize(16);doc.setTextColor(11,49,83);doc.setFont(undefined,'bold');doc.text('Photo Evidence',margin,y);y+=10;for(const ev of state.evidence){try{if(y>210){doc.addPage();y=18;}const url=await signedUrl(ev.storage_path,900);const data=await imageData(url);doc.setFontSize(8.5);doc.setTextColor(70,82,91);doc.setFont(undefined,'normal');doc.text(`${ev.item_key} • ${ev.file_name||'evidence'}`,margin,y);y+=4;const dims=fitImage(data,165,80);doc.addImage(data,'JPEG',margin,y,dims.w,dims.h,undefined,'FAST');y+=dims.h+7;}catch(e){console.warn('Evidence PDF skip',e);}}}
      const pages=doc.getNumberOfPages();for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(7.5);doc.setTextColor(130,140,148);doc.text(`Rotary Sp. z o.o. • ${audit.audit_number} • Page ${p}/${pages}`,105,292,{align:'center'});}doc.save(`${audit.audit_number}_${audit.audit_date}_EHS_Audit.pdf`);toast('PDF generated','success');
    }catch(e){console.error(e);toast(`PDF error: ${e.message}`,'error');}}
  async function imageData(url){const r=await fetch(url);if(!r.ok)throw new Error('Image could not be loaded');const b=await r.blob();return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(b);});}
  function fitImage(){return {w:120,h:75};}
  function fallbackPrintableReport(audit){const w=window.open('','_blank');const s=scoreAudit();const map=itemMap();w.document.write(`<html><head><title>${esc(audit.audit_number)}</title><style>body{font-family:Arial;padding:30px;color:#172631}h1,h2{color:#0b3153}.nok{color:#a21f18}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd6dd;padding:7px;text-align:left}img{width:150px}</style></head><body><img src="${LOGO_URL}"><h1>${esc(audit.audit_number)} – EHS Audit</h1><p>Audit date: ${fmtDate(audit.audit_date)} | Created: ${fmtDateTime(audit.created_at)}</p><h2>Score ${s.score}%</h2>${TEMPLATE.map(sec=>`<h2>${esc(sec.title)}</h2><table>${sec.items.map(([k,t])=>{const i=map.get(k)||{};return `<tr><td>${esc(t)}</td><td class="${i.status==='NOK'?'nok':''}">${esc(i.status||'—')}</td><td>${esc(i.comment||'')}</td></tr>`}).join('')}</table>`).join('')}<p><small>Internal Rotary Sp. z o.o. audit tool – not an official GE Vernova system.</small></p></body></html>`);w.document.close();setTimeout(()=>w.print(),400);}

  boot();
})();
</script>
</body></html>
